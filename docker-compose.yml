# Scrobblr backend — Postgres (TimescaleDB) + Redis + API + worker.
#
# This is both the self-host stack and the "shared dev backend" the web/mobile
# devs point at (so they never need the Rust toolchain or a local DB).
#
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up -d --build
#
# The API is then on http://localhost:8080 (docs at /docs, spec at /api.json).
# Uploaded images are on the `uploads` volume, served by the API at /uploads.
# `--profile web` adds the web app, and `--profile caddy` HTTPS for it, the
# API and a separate uploads host (docs/web-integration.md, docs/uploads.md).
#
# NB: pass --env-file so Compose reads .env.docker and NOT the repo's app-level
# .env (which points DATABASE_URL/PUBLIC_BASE_URL at localhost/the emulator).

name: scrobblr

services:
  db:
    # Pinned: a floating tag upgrades TimescaleDB unannounced, and an image
    # older than a database's extension can't load it. Dev and CI run
    # Postgres 18; moving an existing volume to it takes pg_upgrade.
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrobblr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      POSTGRES_DB: ${POSTGRES_DB:-scrobblr}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the server that initializes a new volume listens on the
      # socket only and restarts right after.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-scrobblr} -d ${POSTGRES_DB:-scrobblr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-scrobblr}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-scrobblr}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending migrations (embedded in the binary) before the
  # API and worker start. They refuse to run against an outdated schema.
  migrate:
    image: scrobblr-backend:latest
    pull_policy: never
    command: ["worker", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scrobblr}@db:5432/${POSTGRES_DB:-scrobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrobblr-backend:latest
    command: ["api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scrobblr}@db:5432/${POSTGRES_DB:-scrobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-scrobblr}
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_URL: ${UPLOAD_PUBLIC_URL:-}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=warn}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-}
      AUTH_APP_KEYS: ${AUTH_APP_KEYS:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      WEB_APP_URL: ${WEB_APP_URL:-}
      SCROBBLER_PASSWORD_LOGIN: ${SCROBBLER_PASSWORD_LOGIN:-}
      SCROBBLER_API_KEYS: ${SCROBBLER_API_KEYS:-}
      SCROBBLER_STRICT_API_KEYS: ${SCROBBLER_STRICT_API_KEYS:-}
      SCROBBLER_DAILY_LIMIT: ${SCROBBLER_DAILY_LIMIT:-}
    ports:
      # Behind Caddy, 127.0.0.1:8080: nothing should reach the API around it.
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    # Reuses the image built by the `api` service (never pull from a registry).
    image: scrobblr-backend:latest
    pull_policy: never
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scrobblr}@db:5432/${POSTGRES_DB:-scrobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-scrobblr}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-}
      # The now playing it re-publishes carries image URLs, built like the API's.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      UPLOAD_PUBLIC_URL: ${UPLOAD_PUBLIC_URL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      LASTFM_IMPORT_MAX_SCROBBLES: ${LASTFM_IMPORT_MAX_SCROBBLES:-1000000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      CLASSIFIER_WINDOW_SECS: ${CLASSIFIER_WINDOW_SECS:-3600}
      CLASSIFIER_MAX_RATIO: ${CLASSIFIER_MAX_RATIO:-2.0}
      CLASSIFIER_SLACK_SECS: ${CLASSIFIER_SLACK_SECS:-900}
      RANKING_UNKNOWN_CLIENT_WEIGHT: ${RANKING_UNKNOWN_CLIENT_WEIGHT:-}
      RANKING_NO_LISTENED_WEIGHT: ${RANKING_NO_LISTENED_WEIGHT:-}
      RANKING_NO_DATA_WEIGHT: ${RANKING_NO_DATA_WEIGHT:-}
      RANKING_IMPORT_WEIGHT: ${RANKING_IMPORT_WEIGHT:-}
      RANKING_MIN_ACCOUNT_DAYS: ${RANKING_MIN_ACCOUNT_DAYS:-}
      RANKING_TRACK_DAILY_CAP: ${RANKING_TRACK_DAILY_CAP:-}
      RANKING_ARTIST_DAILY_CAP: ${RANKING_ARTIST_DAILY_CAP:-}
      RANKING_KNOWN_CLIENTS: ${RANKING_KNOWN_CLIENTS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  # Optional (`--profile web`): the SvelteKit web app, an image built from
  # its own repo. Its server calls the API on this network, with the user's
  # session and address (docs/web-integration.md).
  web:
    image: ${WEB_IMAGE:-scrobblr-web:latest}
    profiles: ["web"]
    environment:
      # adapter-node: the public origin, and the client Caddy names.
      ORIGIN: ${WEB_APP_URL:-https://web.localhost}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      # Uploads pass through it on their way to the API, which takes 8 MiB.
      BODY_SIZE_LIMIT: 9M
      SCROBBLR_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional (`--profile caddy`): HTTPS for WEB_DOMAIN and API_DOMAIN,
  # proxied to the web app and the API with the client's address in
  # X-Forwarded-For, and UPLOADS_DOMAIN, served straight from the uploads
  # volume, read-only. Set PUBLIC_BASE_URL=https://$API_DOMAIN,
  # UPLOAD_PUBLIC_URL=https://$UPLOADS_DOMAIN, WEB_APP_URL=https://$WEB_DOMAIN,
  # TRUSTED_PROXY_HOPS=1 and API_PORT=127.0.0.1:8080.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-web.localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost}
      UPLOADS_DOMAIN: ${UPLOADS_DOMAIN:-uploads.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
