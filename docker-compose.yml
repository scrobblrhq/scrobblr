# Scrobblr backend: Postgres (TimescaleDB), Redis, the migrations, the API
# and the worker. No reverse proxy: whoever deploys puts their own in front.
# Starting, updating, backups and what the proxy must do: docs/operations.md.
#
#   cp .env.docker.example .env      # on a server; see the file's header
#   docker compose up -d --build
#
# The API is then on http://127.0.0.1:8080 (docs at /docs, spec at /api.json).
# Uploaded images are on the `uploads` volume, served by the API at /uploads.

name: scrobblr

# Pinned: a floating tag upgrades TimescaleDB unannounced, and an image
# older than a database's extension can't load it. Dev and CI run
# Postgres 18; moving an existing volume to it takes pg_upgrade. The backup
# image is built on it, so its pg_dump is the server's.
x-db-image: &db-image timescale/timescaledb:2.30.2-pg16

# The backup and restore services' connection; a password never goes into
# a URL, so it may hold any character.
x-backup-postgres: &backup-postgres
  PGHOST: db
  PGUSER: ${POSTGRES_USER:-scrobblr}
  PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
  PGDATABASE: ${POSTGRES_DB:-scrobblr}

# Docker keeps container logs forever by default; these rotate them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backup-build: &backup-build
  context: ./backup
  args:
    DB_IMAGE: *db-image

services:
  db:
    image: *db-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrobblr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      POSTGRES_DB: ${POSTGRES_DB:-scrobblr}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the server that initializes a new volume listens on the
      # socket only and restarts right after.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-scrobblr} -d ${POSTGRES_DB:-scrobblr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-scrobblr}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-scrobblr}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # One-shot: applies pending migrations (embedded in the binary) before the
  # API and worker start. They refuse to run against an outdated schema.
  migrate:
    image: scrobblr-backend:latest
    pull_policy: never
    command: ["worker", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scrobblr}@db:5432/${POSTGRES_DB:-scrobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      LOG_FORMAT: ${LOG_FORMAT:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrobblr-backend:latest
    command: ["api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scrobblr}@db:5432/${POSTGRES_DB:-scrobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-scrobblr}
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-}
      RATE_LIMIT_WINDOW_SECS: ${RATE_LIMIT_WINDOW_SECS:-}
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_URL: ${UPLOAD_PUBLIC_URL:-}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=warn}
      LOG_FORMAT: ${LOG_FORMAT:-}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-}
      AUTH_APP_KEYS: ${AUTH_APP_KEYS:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      WEB_APP_URL: ${WEB_APP_URL:-}
      SCROBBLER_PASSWORD_LOGIN: ${SCROBBLER_PASSWORD_LOGIN:-}
      SCROBBLER_API_KEYS: ${SCROBBLER_API_KEYS:-}
      SCROBBLER_STRICT_API_KEYS: ${SCROBBLER_STRICT_API_KEYS:-}
      SCROBBLER_DAILY_LIMIT: ${SCROBBLER_DAILY_LIMIT:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WORKER_STALL_FACTOR: ${WORKER_STALL_FACTOR:-}
    ports:
      # Only the host itself (a proxy on it) by default; API_BIND opens it
      # to an interface a proxy on another machine reaches.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  worker:
    # Reuses the image built by the `api` service (never pull from a registry).
    image: scrobblr-backend:latest
    pull_policy: never
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scrobblr}@db:5432/${POSTGRES_DB:-scrobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scrobblr}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-scrobblr}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      LOG_FORMAT: ${LOG_FORMAT:-}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-}
      # The now playing it re-publishes carries image URLs, built like the API's.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      UPLOAD_PUBLIC_URL: ${UPLOAD_PUBLIC_URL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      LASTFM_IMPORT_MAX_SCROBBLES: ${LASTFM_IMPORT_MAX_SCROBBLES:-1000000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      CLASSIFIER_WINDOW_SECS: ${CLASSIFIER_WINDOW_SECS:-3600}
      CLASSIFIER_MAX_RATIO: ${CLASSIFIER_MAX_RATIO:-2.0}
      CLASSIFIER_SLACK_SECS: ${CLASSIFIER_SLACK_SECS:-900}
      RANKING_UNKNOWN_CLIENT_WEIGHT: ${RANKING_UNKNOWN_CLIENT_WEIGHT:-}
      RANKING_NO_LISTENED_WEIGHT: ${RANKING_NO_LISTENED_WEIGHT:-}
      RANKING_NO_DATA_WEIGHT: ${RANKING_NO_DATA_WEIGHT:-}
      RANKING_IMPORT_WEIGHT: ${RANKING_IMPORT_WEIGHT:-}
      RANKING_MIN_ACCOUNT_DAYS: ${RANKING_MIN_ACCOUNT_DAYS:-}
      RANKING_TRACK_DAILY_CAP: ${RANKING_TRACK_DAILY_CAP:-}
      RANKING_ARTIST_DAILY_CAP: ${RANKING_ARTIST_DAILY_CAP:-}
      RANKING_KNOWN_CLIENTS: ${RANKING_KNOWN_CLIENTS:-}
      WORKER_STALL_FACTOR: ${WORKER_STALL_FACTOR:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    # Unhealthy while a loop is stalled or failing (`worker status`).
    # Docker only reports it: nothing restarts the worker for it.
    healthcheck:
      test: ["CMD", "worker", "status"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *logging


  # Backs up the database and the uploads daily into BACKUP_DIR, keeps
  # BACKUP_KEEP_DAILY daily and BACKUP_KEEP_WEEKLY weekly ones, optionally
  # copies them to BACKUP_REMOTE (docs/operations.md). Reads the app's
  # data, never writes it. Unhealthy while the last backup failed or is
  # older than BACKUP_MAX_AGE_HOURS.
  backup:
    build: *backup-build
    image: scrobblr-backup:latest
    environment:
      <<: *backup-postgres
      BACKUP_TIME: ${BACKUP_TIME:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
      - ${BACKUP_RCLONE_DIR:-./backup/rclone}:/config/rclone
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "scrobblr-backup", "check"]
      interval: 5m
      timeout: 30s
      retries: 1
      # The first backup runs at startup and may take a while.
      start_period: 1h
    restart: unless-stopped
    logging: *logging

  # Not started by `up`: `docker compose run --rm restore NAME [--replace]`
  # with the api, worker and backup stopped (docs/operations.md).
  restore:
    build: *backup-build
    image: scrobblr-backup:latest
    profiles: ["restore"]
    entrypoint: ["scrobblr-backup", "restore"]
    environment:
      <<: *backup-postgres
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

volumes:
  db-data:
  uploads:
