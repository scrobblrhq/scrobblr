# Cloudflare Tunnel `scrobblr`, run by docker-compose.tunnel.yml
# (docs/tunnel-deploy.md). Every host goes to Caddy, which routes it.
#
# The tunnel's credentials file goes next to this one, under the name
# below. It is secret and git-ignored, as is a cert.pem (running the
# tunnel needs none).
tunnel: 49ca94d1-cfc8-4c1a-a233-4db6a9da97ec
credentials-file: /etc/cloudflared/49ca94d1-cfc8-4c1a-a233-4db6a9da97ec.json

# For the container's health check (`cloudflared tunnel ready`).
metrics: 127.0.0.1:2000

ingress:
  - hostname: scrobblr.app
    service: http://caddy:80
  - hostname: api.scrobblr.app
    service: http://caddy:80
  - hostname: cdn.scrobblr.app
    service: http://caddy:80
  - service: http_status:404
