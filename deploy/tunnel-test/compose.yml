# For run.sh: cloudflared replaced by a stand-in for Cloudflare's edge, on a
# network of its own playing the internet, and the web app by an echo of
# the headers it gets.
services:
  cloudflared:
    image: caddy:2.11.7-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    volumes:
      - ./deploy/tunnel-test/edge.Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      disable: true
    networks:
      internet:
        ipv4_address: 198.18.0.2

  web:
    image: caddy:2.11.7-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    volumes:
      - ./deploy/tunnel-test/web.Caddyfile:/etc/caddy/Caddyfile:ro

  migrate:
    image: scrobblr-backend:tunnel-test
  api:
    image: scrobblr-backend:tunnel-test
  worker:
    image: scrobblr-backend:tunnel-test

networks:
  internet:
    ipam:
      config:
        - subnet: 198.18.0.0/24
